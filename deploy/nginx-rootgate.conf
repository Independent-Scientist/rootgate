# Reference nginx vhost for the rootgate approval page.
#
#   server_name  approve.example.com;    # your name, not a real one
#   proxy_pass   http://127.0.0.1:8733;   # where the tunnel lands
#
# deploy/vps-provision.sh writes an equivalent config and obtains the
# certificate; this copy is for people who configure nginx by hand or use a
# different ACME client.

server {
    listen 80;
    listen [::]:80;
    server_name approve.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name approve.example.com;

    ssl_certificate     /etc/letsencrypt/live/approve.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/approve.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Approval traffic only: short, small, and not worth logging.
    access_log off;
    client_max_body_size 8k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8733;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
